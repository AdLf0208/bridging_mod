# Bridging Mod for Horizon — one flat SDK package (native code, no carried content).
#
# Migrated 2026-11-18 from the retired `.hnmod` container (Horizon's mod-API merge
# #16941, launcher >= 0.2.70; the registry closed every `.hnmod` submission with the
# format purge). The manifest below is the only one: identity, the schema's one
# capability and the exact native pins.
#
# Licence: MIT, read from the jar (`licence-cache/BridgingMod-2.6.2+1.21.1.neoforge-release.jar`)
# and the upstream repository's LICENSE (rank 0, permissive). `LICENSE` and
# `LICENSE-NOTICE.md` travel inside the package. Local-only until the maintainer
# approves publishing (ARCHITECTURE.md §8).
id = "bridgingmod"
name = "Bridging Mod"
version = "0.2.0"
description = """A port of Bridging Mod for Horizon: a right click in the air with a placeable block item
fills the gap the player looks into, so a bridge can be built over an edge without aiming at a
block face. Upstream is a client-side aim assist; this is a server-side rewrite of the same
target model, which works in single player and on a server alike. The client VFX (crosshair
arrows, block outline), the keybind/config screen and the special-item compatibility layer are
not ported."""
authors = ["squeeglii", "AdLf0208"]
# The content API: exact and checked. This package carries no blocks or items of its own, but the
# schema's one allowed value is required even then; it is not a claim about content.
api = "0.2"
# The installation side, not the hook's: an integrated server belongs to the client
# installation, so a LAN host or a single-player world needs both.
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
